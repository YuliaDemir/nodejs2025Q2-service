version: '3.9'

networks:
  app-network:
    driver: bridge

services:
  db:
    build: ./postgres
    container_name: postgres-db
    environment: 
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    networks:
      - app-network

  app:
    build: .
    container_name: node-app
    environment: 
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - app-network