version: '3.9'

networks:
  app-network:
    driver: bridge

services:
  db:
    build: ./postgres
    container_name: postgres-db
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    build: .
    restart: always
    volumes:
      - ./src:/app/src
      - /app/node_modules
    container_name: node-app
    environment: 
      DB_HOST: db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${PORT}
    ports:
      - "${PORT}:${PORT}"
    networks:
      - app-network
volumes:
  pgdata: